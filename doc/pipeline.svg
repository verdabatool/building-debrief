  <path d="M654 480 L668 480 L668 455 L680 455" stroke="#8A887E" fill="none" marker-end="url(#g)"/>
  <path d="M654 494 L668 494 L668 519 L680 519" stroke="#8A887E" fill="none" marker-end="url(#g)"/>

  <text x="20" y="606" font-size="11" fill="#7C7A70">Three commands, one per mechanism. Same transcript in, eight files out. The only arrow that runs between two</text>
  <text x="20" y="622" font-size="11" fill="#7C7A70">writers is the clay one in the last lane.</text>
