  <rect x="684" y="500" width="170" height="38" rx="7" fill="#F1EEE4" stroke="#E4E0D4"/>
  <text x="769" y="524" font-size="11" fill="#141413" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">flashcards.html</text>

